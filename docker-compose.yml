services:
  shop:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5343}
    image: kapidamart:latest
    container_name: afu-kapidamart-shop
    ports:
      - "5343:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5343}
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
